# Render Blueprint for the SehatLine backend.
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint → pick the
# repo. Render reads this file and provisions the web service below.
#
# You still set MONGO_URI yourself (it's a secret — `sync: false`), and JWT_SECRET
# is auto-generated as a strong value by Render.
services:
  - type: web
    name: sehatline-backend
    runtime: node
    plan: free            # NOTE: free spins down after ~15 min idle (cold starts,
                          # and the 2 PM cron backup / live sockets won't run while
                          # asleep). Use "starter" ($7/mo) for an always-on service.
    region: singapore     # closest free region to Pakistan
    rootDir: backend      # blueprint is at repo root; backend code lives in backend/
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # No Python on the Node service — skip the ML subprocess spawn.
      - key: ML_AUTOSTART
        value: "false"
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: SESSION_INACTIVITY_MINUTES
        value: "5"
      # Strong 32+ char secret, generated by Render (satisfies the prod guard).
      - key: JWT_SECRET
        generateValue: true
      # Your MongoDB Atlas connection string — set this in the Render dashboard.
      - key: MONGO_URI
        sync: false
      # OPTIONAL — password-reset emails (Gmail app password). Leave unset to skip.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
